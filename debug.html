<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Debug</title>
<link rel="stylesheet" href="css/styles.css?v=90dc08e7">
</head>
<body>
<div id="app" class="screen screen-play">
  <header class="play-head">
    <button class="icon-btn" aria-label="Salir">←</button>
    <div class="play-title"><h1>Aleatorio</h1><span class="sub">Exigente</span></div>
    <button class="icon-btn" aria-label="Girar el tablero">⇅</button>
  </header>
  <div class="hud">
    <div class="hud-item"><span class="hud-label">Resueltos</span><span class="hud-value">0</span></div>
    <div class="hud-item"><span class="hud-label">Acierto</span><span class="hud-value">—</span></div>
  </div>
  <div class="board-wrap"><div class="board-host board"></div></div>
  <div class="movebar">
    <button class="nav-btn">‹</button>
    <div class="moves">1. e4</div>
    <button class="nav-btn">›</button>
  </div>
  <footer class="play-foot">
    <p class="status">Juegan las blancas</p>
    <div class="puzzle-info"></div>
    <div class="actions">
      <button class="btn ghost">Pista</button>
      <button class="btn ghost">Ver solución</button>
    </div>
  </footer>
</div>
<pre id="out" style="position:fixed;top:0;left:0;right:0;background:#fff;color:#000;font-size:12px;padding:8px;z-index:9999;white-space:pre-wrap;margin:0;"></pre>
<script>
  function report() {
    var w = document.querySelector('.board-wrap');
    var b = document.querySelector('.board');
    var cs = getComputedStyle(w);
    var r = w.getBoundingClientRect();
    var rb = b.getBoundingClientRect();
    document.getElementById('out').textContent =
      'innerH=' + innerHeight + ' innerW=' + innerWidth + '\n' +
      'wrap rect x=' + r.x + ' w=' + r.width + ' h=' + r.height + '\n' +
      'board rect x=' + rb.x + ' w=' + rb.width + '\n' +
      'footH=' + document.querySelector('.play-foot').getBoundingClientRect().height + '\n' +
      'headH=' + document.querySelector('.play-head').getBoundingClientRect().height + '\n' +
      'hudH=' + document.querySelector('.hud').getBoundingClientRect().height + '\n' +
      'moveH=' + document.querySelector('.movebar').getBoundingClientRect().height;
  }
  report();
  window.addEventListener('resize', report);
</script>
</body>
</html>
