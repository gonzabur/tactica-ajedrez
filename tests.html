<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tests — Táctica</title>
<style>
  body { font: 13px/1.5 ui-monospace, monospace; padding: 16px; background: #12141a; color: #e8e8e8; }
  #out { white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="out">Ejecutando…</pre>

<!-- Mismo orden de carga que index.html (sin app.js/play.js/board.js: aquí
     no se pinta nada, solo se llama a la lógica). -->
<script src="vendor/chess.js"></script>
<script src="js/pieces.js"></script>
<script src="data/puzzles.js"></script>
<script src="js/themes.js"></script>
<script src="js/storage.js"></script>
<script src="js/rating.js"></script>
<script src="js/sound.js"></script>
<script src="js/data.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/modes.js"></script>
<script src="data/openings.js"></script>
<script src="js/openings.js"></script>

<script>
/**
 * Comprobaciones mínimas de la lógica que falla en silencio: si se rompe el
 * Elo, la escalada de dificultad o el cálculo de "dónde flojeas", la app
 * sigue funcionando sin ningún error visible, solo dando números raros.
 *
 * No toca datos reales: exporta el progreso actual antes de cada bloque y lo
 * restaura al acabar, así que es seguro abrir esta página en un dispositivo
 * con partidas guardadas.
 */
(function () {
  var results = [];
  function assert(name, cond, detail) {
    results.push({ name: name, ok: !!cond, detail: detail });
  }

  // --- Rating (Elo) --------------------------------------------------------
  (function () {
    var vsFuerte = window.Rating.update(1500, 1700, 1, 100).delta;
    var vsDebil = window.Rating.update(1500, 1300, 1, 100).delta;
    assert("Rating: ganar a un rival más fuerte sube más que a uno más débil",
      vsFuerte > vsDebil, "fuerte=" + vsFuerte + " debil=" + vsDebil);

    assert("Rating: fallar siempre baja el rating",
      window.Rating.update(1500, 1500, 0, 100).delta < 0);

    assert("Rating: el delta está acotado a ±40",
      Math.abs(window.Rating.update(1500, 3000, 1, 5).delta) <= 40);

    var deltaNovato = Math.abs(window.Rating.update(1500, 1900, 1, 5).delta);
    var deltaVeterano = Math.abs(window.Rating.update(1500, 1900, 1, 500).delta);
    assert("Rating: el factor K baja con la experiencia (mismo cambio pesa menos)",
      deltaNovato > deltaVeterano, "novato=" + deltaNovato + " veterano=" + deltaVeterano);

    assert("Rating: nunca baja de MIN",
      window.Rating.update(window.Rating.MIN, 3000, 0, 500).rating >= window.Rating.MIN);
    assert("Rating: nunca sube de MAX",
      window.Rating.update(window.Rating.MAX, 400, 1, 5).rating <= window.Rating.MAX);

    assert("Rating: targetFor (clasificado) siempre por encima del jugador",
      window.Rating.targetFor(1500) > 1500);
  })();

  // --- Escalada de dificultad: supervivencia/contrarreloj (ladder) --------
  (function () {
    var saved = window.Store.exportJson();
    try {
      window.Store.reset();
      window.Store.setRating(1500);
      var fake = { index: 0, themes: [] };

      var mode = window.Modes.survival();
      for (var i = 0; i < 10; i++) mode.result({ puzzle: fake, clean: true });
      var summary = mode.finish();
      // base = clamp(1500-450, 600, 1000) = 1000; step=36 -> 1000 + 10*36 = 1360
      assert("Escalada: sube con cada acierto según la fórmula esperada",
        summary.topRating === 1360, "obtenido=" + summary.topRating);

      var mode2 = window.Modes.survival();
      var out1 = mode2.result({ puzzle: fake, clean: false });
      assert("Escalada: un fallo resta una vida sin acabar la partida (3 vidas)", !out1.over);
      mode2.result({ puzzle: fake, clean: false });
      var out3 = mode2.result({ puzzle: fake, clean: false });
      assert("Escalada: la tercera vida perdida sí acaba la partida", out3.over === true);
    } finally {
      window.Store.importJson(saved);
    }
  })();

  // --- Ranking y estadísticas de fin de partida -----------------------------
  (function () {
    var saved = window.Store.exportJson();
    try {
      window.Store.reset();
      var hace30dias = Date.now() - 30 * 24 * 60 * 60 * 1000;
      window.Store.state.scores.survival.push({ v: 50, t: hace30dias });
      window.Store.pushScore("survival", 12);
      window.Store.pushScore("survival", 8);

      assert("Ranking: la mejor de hoy es la #1 de hoy",
        window.Store.rankScore("survival", 12, "day") === 1);
      assert("Ranking: una partida vieja mejor cuenta en 'todo el tiempo'",
        window.Store.rankScore("survival", 12) === 2);
      assert("Ranking: pero no en 'esta semana'",
        window.Store.rankScore("survival", 12, "week") === 1);
      assert("Ranking: los empates comparten puesto",
        window.Store.rankScore("survival", 8, "day") === 2);

      var mode = window.Modes.survival();
      mode.result({ puzzle: { index: 0, themes: [], rating: 1400 }, clean: true });
      mode.result({ puzzle: { index: 1, themes: [], rating: 1600 }, clean: false });
      mode.result({ puzzle: { index: 2, themes: [], rating: 1500 }, clean: true });
      var s = mode.finish();
      assert("Fin de partida: el problema más difícil es el más alto ACERTADO",
        s.hardest === 1500, "obtenido=" + s.hardest);
      // 2 aciertos, detrás de las de 12 y 8 de hoy
      assert("Fin de partida: la partida recién jugada entra en el ranking",
        s.rank.day === 3, "obtenido=" + s.rank.day);
    } finally {
      window.Store.importJson(saved);
    }
  })();

  // --- Aperturas: repaso espaciado ----------------------------------------
  (function () {
    var saved = window.Store.exportJson();
    try {
      window.Store.reset();
      var O = window.Openings;
      var ital = O.byId("italiana");

      assert("Aperturas: sin repertorio no hay nada que aprender", O.nextToLearn() === null);
      O.toggle("italiana");
      O.toggle("caro-kann");
      assert("Aperturas: se aprende en orden, primero la principal",
        O.nextToLearn().line.id === ital.lines[0].id);

      O.markLearned(ital.lines[0].id);
      assert("Aperturas: lo recién aprendido se repasa hoy mismo",
        O.dueItems().length === 1 && O.status(ital.lines[0].id).kind === "due");
      assert("Aperturas: no se pasa a otra apertura hasta terminar la actual",
        O.nextToLearn().opening.id === "italiana");

      O.grade(ital.lines[0].id, true);
      var c = window.Store.state.openings.cards[ital.lines[0].id];
      assert("Aperturas: acertar sube de caja y aplaza el repaso",
        c.box === 1 && O.status(ital.lines[0].id).kind === "later", JSON.stringify(c));
      O.grade(ital.lines[0].id, false);
      assert("Aperturas: fallar devuelve a la caja 0",
        window.Store.state.openings.cards[ital.lines[0].id].box === 0);

      // nada pendiente -> repaso libre: acertar no adelanta el calendario
      O.grade(ital.lines[0].id, true);
      var cita = function () {
        var k = window.Store.state.openings.cards[ital.lines[0].id];
        return k.box + " " + k.due;
      };
      var antes = cita();
      var libre = O.review();
      var p0 = libre.next();
      libre.result({ puzzle: p0, clean: true });
      assert("Aperturas: el repaso libre sale aunque no toque y no cambia la caja",
        p0 && cita() === antes);

      // repaso dejado a medias: se retoma con lo que quedaba, fallos incluidos
      O.markLearned(ital.lines[1].id);
      O.markLearned(ital.lines[2].id);
      var r1 = O.review();
      var q1 = r1.next();
      r1.result({ puzzle: q1, clean: false });   // fallada: ya no "toca hoy"
      var q2 = r1.next();                        // y se sale con esta a medias
      var r2 = O.review();
      var quedan = O.pendingReview().items.map(function (it) { return it.line.id; });
      assert("Aperturas: al salir del repaso se retoma donde estaba",
        quedan.length === 2 && quedan[0] === q2.line.id && quedan[1] === q1.line.id &&
        r2.next().line.id === q2.line.id &&
        r2.hudHtml().indexOf("Línea 2 de 2") > 0 && r2.hudHtml().indexOf("1 por repetir") > 0,
        quedan.join(","));
      var t2 = r2.result({ puzzle: q2, clean: true }).text;
      assert("Aperturas: al acertar se dice cuándo vuelve (caja 1 = 2 días)",
        t2 === "¡Correcto! Vuelve en 2 días", t2);
      // la fallada vuelve con tres pasadas de memoria; equivocarse ahí no la reencola
      var pr = r2.next(), pasos = [];
      for (var k = 0; k < 3; k++) {
        pasos.push(r2.hintAfter.join("/") + (r2.hudHtml().indexOf("De memoria " + (k + 1) + "/3") > 0 ? "" : "?"));
        var out = r2.result({ puzzle: pr, clean: false });
        if (k < 2) r2.next();
      }
      assert("Aperturas: una fallada se repite con tres intentos de memoria (5/10, 10/15, 15/20)",
        pr.line.id === q1.line.id && pasos.join(" ") === "5/10 10/15 15/20" &&
        out.text === "¡Hecha! Vuelve mañana", pasos.join(" ") + " " + out.text);
      var c1 = window.Store.state.openings.cards[q1.line.id];
      var c2 = window.Store.state.openings.cards[q2.line.id];
      assert("Aperturas: terminado el repaso no queda nada a medias",
        r2.next() === null && !O.pendingReview());
      assert("Aperturas: el historial cuenta solo el primer intento de cada repaso",
        c1.tries === 1 && !c1.ok && c2.tries === 1 && c2.ok === 1, JSON.stringify([c1, c2]));
      var fin = r2.finish();
      assert("Aperturas: el resumen lista cada línea con su % y deja abrir las falladas",
        fin.score === 1 && fin.detailHtml.indexOf("1 de 1 a la primera · 100 %") > 0 &&
        fin.detailHtml.indexOf('data-go="#/aperturas/linea/' + q1.line.id + '"') > 0 &&
        fin.detailHtml.indexOf("0 de 1 a la primera · 0 %") > 0);

      assert("Aperturas: avisa de que falta respuesta a 1.d4",
        O.gaps().join(" ").indexOf("1.d4") >= 0, O.gaps().join(" "));

      // cada línea de cada apertura se convierte en jugadas legales
      var bad = [];
      O.all().forEach(function (op) {
        op.lines.forEach(function (line) {
          var mode = O.learn(line.id);
          var p = mode.next();
          if (!p || p.moves.length !== line.moves.length) bad.push(line.id);
          if (p && p.playerFirst !== (op.color === "w")) bad.push(line.id + " (color)");
        });
      });
      assert("Aperturas: todas las líneas se cargan como jugadas", !bad.length, bad.join(", "));
    } finally {
      window.Store.importJson(saved);
    }
  })();

  // --- Aperturas: aprender = guiada + de memoria -----------------------------
  (function () {
    var saved = window.Store.exportJson();
    try {
      window.Store.reset();
      var O = window.Openings, id = "italiana-principal";

      var m = O.learn(id);
      var p = m.next();
      assert("Aprender: la primera pasada es guiada y sin pistas por tiempo", m.guided && !m.hintAfter);
      var r0 = m.result({ puzzle: p, clean: true });
      assert("Aprender: tras la guiada la línea aún NO cuenta como aprendida",
        !O.learnedItems().length && window.Store.state.openings.cards[id] === undefined);
      assert("Aprender: tras la guiada se propone el intento 1 y se enseña el plan",
        r0.nextLabel === "Intento 1 de 3" && r0.plan !== false);

      // tres intentos de memoria, siempre, salgan limpios o no; la ayuda llega cada vez más tarde
      var tiempos = [], mismos = true, pendientes = true, r;
      for (var k = 1; k <= 3; k++) {
        p = m.next();
        mismos = mismos && p && p.line.id === id && !m.guided;
        tiempos.push(m.hintAfter.join("/"));
        r = m.result({ puzzle: p, clean: true });
        if (k < 3) pendientes = pendientes && r.plan !== false && !!r.nextLabel &&
          window.Store.state.openings.cards[id] === undefined;
      }
      assert("Aprender: los tres intentos son la misma línea, sin guía", mismos);
      assert("Aprender: las pistas llegan a los 5/10, 10/15 y 15/20 s",
        tiempos.join(" ") === "5/10 10/15 15/20", tiempos.join(" "));
      assert("Aprender: aunque salgan limpios, no se da por aprendida hasta el tercero", pendientes);
      assert("Aprender: tras el tercero queda aprendida y se enseña el plan",
        !!window.Store.state.openings.cards[id] && r.plan !== false && !r.nextLabel);
      assert("Aprender: después no queda nada más de esa línea", m.next() === null);
    } finally {
      window.Store.importJson(saved);
    }
  })();

  // --- Aperturas: flechas del plan -------------------------------------------
  // Cada flecha tiene que ser jugable sobre la posición final, en su orden:
  // una errata en una casilla dibujaría una flecha que no significa nada.
  (function () {
    function file(sq) { return sq.charCodeAt(0) - 97; }
    function rank(sq) { return +sq.charAt(1); }
    var bad = [], total = 0, sinFlechas = [];

    window.OPENINGS.forEach(function (op) {
      var opp = op.color === "w" ? "b" : "w";
      op.lines.forEach(function (line) {
        var arrows = window.Openings.planArrows(line);
        if (!arrows.length || arrows.length > 4) sinFlechas.push(line.id);
        var game = new window.Chess();
        line.moves.forEach(function (m) { game.move(m); });

        arrows.forEach(function (a, i) {
          total++;
          var where = line.id + " #" + (i + 1);
          if (a.kind === "attack") {
            var p = game.get(a.from);
            var dx = Math.abs(file(a.to) - file(a.from)), dy = rank(a.to) - rank(a.from);
            var ady = Math.abs(dy), diag = dx === ady && dx > 0, line_ = (dx === 0) !== (ady === 0);
            var reach = p && {
              n: dx * ady === 2, b: diag, r: line_, q: diag || line_,
              k: Math.max(dx, ady) === 1, p: dx === 1 && dy === (op.color === "w" ? 1 : -1)
            }[p.type];
            if (!p || p.color !== op.color || !reach) bad.push(where);
            return;
          }
          // se fuerza el turno: el plan no alterna jugadas como una partida
          var fen = game.fen().split(" ");
          fen[1] = a.kind === "opp" ? opp : op.color;
          fen[3] = "-";
          var next = new window.Chess(fen.join(" "));
          if (!next.move({ from: a.from, to: a.to, promotion: "q" })) { bad.push(where); return; }
          game.load(next.fen());
        });
      });
    });

    assert("Aperturas: todas las líneas tienen entre 1 y 4 flechas de plan",
      !sinFlechas.length, sinFlechas.join(", "));
    assert("Aperturas: todas las flechas son jugadas legales en su orden",
      !bad.length, bad.length ? bad.join(", ") : total + " flechas");
  })();

  // --- Store.weakestThemes --------------------------------------------------
  (function () {
    var saved = window.Store.exportJson();
    try {
      window.Store.reset();
      var ids = Object.keys(window.THEMES.labels);
      var peor = ids[0], mejor = ids[1];
      window.Store.state.stats.byTheme[peor] = { ok: 1, ko: 9 };   // 10% acierto
      window.Store.state.stats.byTheme[mejor] = { ok: 9, ko: 1 };  // 90% acierto

      var weak = window.Store.weakestThemes(4);
      assert("weakestThemes: el tema con peor acierto sale primero",
        weak[0].id === peor, "obtenido=" + weak[0].id);

      assert("weakestThemes: descarta temas con menos intentos que el mínimo",
        window.Store.weakestThemes(20).length === 0);

      assert("weakestThemes: limit recorta la lista",
        window.Store.weakestThemes(4, 1).length === 1);
    } finally {
      window.Store.importJson(saved);
    }
  })();

  // --- resultado -------------------------------------------------------------
  var pass = results.filter(function (r) { return r.ok; }).length;
  var lines = results.map(function (r) {
    return (r.ok ? "✓" : "✗ FALLO") + " " + r.name + (r.detail ? "  (" + r.detail + ")" : "");
  });
  document.getElementById("out").textContent = pass + "/" + results.length + " OK\n\n" + lines.join("\n");
  document.title = (pass === results.length ? "✓ " : "✗ ") + pass + "/" + results.length + " — Tests";
})();
</script>
</body>
</html>
